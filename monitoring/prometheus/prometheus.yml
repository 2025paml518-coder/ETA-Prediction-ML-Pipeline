# Prometheus scrape configuration for the ETA API.
#
# The API exposes /metrics in Prometheus exposition format. We scrape it on a
# short interval so p95/p99 latency and prediction counters stay fresh in Grafana.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eta-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: eta-api
