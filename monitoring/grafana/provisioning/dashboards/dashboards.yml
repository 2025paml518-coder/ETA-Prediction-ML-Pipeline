# Grafana dashboard provider: load JSON dashboards from disk on startup.
apiVersion: 1

providers:
  - name: eta-dashboards
    orgId: 1
    folder: ETA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
