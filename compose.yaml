# podman-compose up --build
#
# The API exposes /metrics in Prometheus exposition format. Prometheus scrapes it
# and Grafana visualises it; all three share a private network so they can reach
# each other by service name.

services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    image: eta-api:latest
    container_name: eta-api
    ports:
      - "8000:8000"
    environment:
      # Uvicorn worker count. Each worker holds its own copy of the model, so this
      # trades memory for concurrency; one is right for a laptop demo.
      UVICORN_WORKERS: "1"
    volumes:
      # Prediction log persists across container restarts so Week 4 monitoring can
      # look back beyond the current process lifetime.
      - ./monitoring/data:/app/monitoring/data:z
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - eta-net

  prometheus:
    image: prom/prometheus:latest
    container_name: eta-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eta-net

  grafana:
    image: grafana/grafana:latest
    container_name: eta-grafana
    ports:
      - "3000:3000"
    environment:
      # Local demo defaults; change before exposing beyond a laptop.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:z
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:z
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - eta-net

networks:
  eta-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
