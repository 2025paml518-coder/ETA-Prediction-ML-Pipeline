# Central configuration for every DVC pipeline stage.
# Changing a value here invalidates the affected stage and triggers `dvc repro`.

seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  quarantine: data/quarantine
  drift: data/drift
  models: models
  reports: reports
  monitoring: monitoring/data

# --------------------------------------------------------------------------
# Stage 1: synthetic trip generation
# --------------------------------------------------------------------------
generate:
  n_trips: 150000
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  scenario: baseline
  output_file: trips_raw.parquet

  # Fraction of rows deliberately corrupted so the validation stage has real
  # defects to catch (missing GPS pings / invalid timestamps are named in the brief).
  defect_rates:
    missing_gps: 0.012
    invalid_timestamp: 0.006
    out_of_bounds_gps: 0.004
    duplicate_trip_id: 0.003
    extreme_duration: 0.005
    missing_weather: 0.008
    missing_passenger_count: 0.004
    impossible_speed: 0.003
    # Cross-field contradiction: only a Level 4 business rule can catch it, since
    # every individual value stays within its own legal range.
    inconsistent_weather: 0.004

# --------------------------------------------------------------------------
# Stage 2: schema + statistical validation
# --------------------------------------------------------------------------
validate:
  # Abort the pipeline if more than this fraction of rows fail validation:
  # a spike in bad rows means the upstream source changed, not that the data is noisy.
  max_bad_row_fraction: 0.15
  min_rows: 10000
  bounds:
    latitude: [40.55, 40.95]
    longitude: [-74.10, -73.70]
    trip_duration_min: [1.0, 300.0]
    avg_speed_kmph: [1.0, 120.0]
    passenger_count: [1, 6]
    temperature_c: [-25.0, 45.0]
    precipitation_mm: [0.0, 80.0]
    wind_kph: [0.0, 120.0]
    traffic_index: [0.0, 1.0]
  allowed_weather:
    - Clear
    - Cloudy
    - Rain
    - Snow
    - Fog
  allowed_vendors: [1, 2, 3]

  # Level 4: compound rules spanning several fields, which no single-column
  # range or schema check can express.
  business_rules:
    wet_weather_conditions: [Rain, Snow]
    snow_max_temperature_c: 5.0
    stationary_max_km: 0.05
    stationary_max_minutes: 60.0

  # Level 3: distribution comparison against the training baseline.
  statistical:
    ks_pvalue_threshold: 0.01
    # With ~100k baseline rows a KS test reaches significance on differences far too
    # small to act on, so a minimum effect size must also be met before warning.
    ks_statistic_warn: 0.05
    chi2_pvalue_threshold: 0.01
    mean_shift_sd_warn: 1.0
    mean_shift_sd_fail: 2.0
    null_rate_increase_fail: 0.10
    category_shift_warn: 0.05
    category_shift_fail: 0.15
    action_on_failure: fail

# --------------------------------------------------------------------------
# Baseline profile: built from the training partition only, and used to run
# Level 3 validation on every batch ingested after it.
# --------------------------------------------------------------------------
profile:
  reference_sample_size: 2000
  output_file: baseline_profile.json

# --------------------------------------------------------------------------
# Stage 3: feature engineering
# --------------------------------------------------------------------------
features:
  n_zone_clusters: 20
  rush_hours_morning: [7, 10]
  rush_hours_evening: [16, 19]
  target: trip_duration_min
  output_file: features.parquet
  # Imputation values are learned from the training partition and persisted with
  # the pipeline, so serving never recomputes them from production data.
  imputation:
    weather_strategy: month_mode
    numeric_strategy: month_median

# --------------------------------------------------------------------------
# Stage 4: train / validation / test split
# --------------------------------------------------------------------------
split:
  # Temporal split, not random: a random split would leak future traffic
  # conditions into training and inflate offline metrics.
  strategy: temporal
  val_fraction: 0.15
  test_fraction: 0.15

# --------------------------------------------------------------------------
# Stage 5: model training and experiment tracking (M3)
# --------------------------------------------------------------------------
train:
  experiment_name: eta-prediction
  registered_model_name: eta-predictor
  tracking_uri: mlruns

  # The model is chosen on VALIDATION. The test partition is scored once, for the
  # final report only - selecting on it would make the reported figure a biased
  # estimate of production error rather than an honest one.
  selection:
    partition: val
    metric: mae
    lower_is_better: true

  cv:
    # TimeSeriesSplit, not KFold. The split stage ordered the data in time on
    # purpose; shuffling inside the search would put later trips in the training
    # folds of earlier ones and reintroduce exactly the leakage that was avoided.
    strategy: time_series
    n_splits: 3

# --------------------------------------------------------------------------
# Stage 6: monitoring — drift simulation and retraining trigger (M5)
# --------------------------------------------------------------------------
monitoring:
  # Drift is a known intervention on the synthetic generator, not a guess, so the
  # simulation is fully reproducible: the same scenario and seed always yield the
  # same reference and drifted windows. Swap `scenario` for monsoon / new_zone /
  # concept_drift to rehearse a different failure mode.
  drift:
    reference_scenario: baseline
    scenario: festival_surge
    n_trips: 20000
    seed: 202
    start_date: "2024-01-01"
    end_date: "2024-12-31"

  # The live-error signal reads recent labelled predictions from the serving log.
  # Below `min_labelled` it abstains rather than voting on thin data, and the whole
  # signal can be switched off so `dvc repro` stays deterministic on a cold store.
  lookback:
    use_live_feedback: true
    min_labelled: 50
    max_rows: 5000

  # Every threshold that turns a measured number into a pass / warn / fail verdict.
  thresholds:
    # Performance drift: model error on the drifted window relative to the reference
    # window, plus an absolute floor so a already-poor model still trips regardless
    # of ratio.
    perf_mae_warn_ratio: 1.15
    perf_mae_fail_ratio: 1.30
    perf_mae_warn_abs_min: 6.0
    perf_mae_fail_abs_min: 8.0
    # Feature drift: how many columns Level 3 flags (warn or fail) before the batch
    # is treated as suspect.
    feature_warn_columns: 1
    feature_fail_columns: 2
    # Live error: mean absolute error over recently labelled predictions.
    live_mae_warn_min: 6.0
    live_mae_fail_min: 8.0

  # A retrain is triggered when at least this many independent signals reach 'fail'.
  # One decisive signal is enough by default; raise it to require two signals to
  # agree before paying for a retrain.
  retrain:
    fail_signals_to_trigger: 1

  search:
    scoring: neg_mean_absolute_error
    random_state: 42
    # Search budget per model. Random Forest is deliberately smaller: each fit is
    # an order of magnitude more expensive than the alternatives.
    n_iter:
      ridge: 12
      random_forest: 8
      lightgbm: 20

  models:
    baseline: true
    ridge: true
    random_forest: true
    lightgbm: true

